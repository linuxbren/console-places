# Opens a pull request when tideui (the UI library console-places builds on) has a
# new release, so upstream fixes get picked up. Only tideui, monthly, to keep
# it quiet. A tideui bump changes the Nix vendorHash; the CI nix job says so.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: github.com/allisonhere/tideui
    commit-message:
      prefix: deps
