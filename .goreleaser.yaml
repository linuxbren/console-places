# Release builds: pushing a v* tag runs .github/workflows/release.yml, which
# runs GoReleaser to build static Linux binaries and packages and attach
# them, with checksums, to the GitHub release. See RELEASING.md.
# tidefiles is Linux only.
version: 2
project_name: tidefiles

before:
  hooks:
    - go mod download

builds:
  - id: tidefiles
    binary: tidefiles
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - id: tidefiles
    formats: [tar.gz]
    # No version in the name, so .../releases/latest/download/<name> always works.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - contrib/omarchy-super-c.lua

checksum:
  name_template: checksums.txt
  algorithm: sha256

nfpms:
  - id: packages
    package_name: tidefiles
    file_name_template: "{{ .PackageName }}_{{ .Arch }}"
    vendor: linuxbren
    maintainer: linuxbren <linuxbren@gmail.com>
    homepage: https://github.com/linuxbren/tidefiles
    description: Keyboard-first terminal file manager with previews, tabs and archive browsing
    license: MIT
    formats: [deb, rpm, apk]
    bindir: /usr/bin
    section: utils
    contents:
      - src: README.md
        dst: /usr/share/doc/tidefiles/README.md
      - src: LICENSE
        dst: /usr/share/licenses/tidefiles/LICENSE
      - src: contrib/omarchy-super-c.lua
        dst: /usr/share/tidefiles/omarchy-super-c.lua
    # Optional helpers (clipboard, archives, faster search, previews, drives and
    # network places), under
    # each distro's own package names.
    overrides:
      deb:
        recommends: [wl-clipboard, libarchive-tools, ripgrep]
        suggests: [xclip, imagemagick, poppler-utils, ffmpegthumbnailer, ffmpeg, xdg-utils, udisks2, gvfs, gvfs-fuse, gvfs-backends, avahi-utils, smbclient, cifs-utils, nfs-common]
      rpm:
        recommends: [wl-clipboard, bsdtar, ripgrep]
        suggests: [xclip, ImageMagick, poppler-utils, ffmpegthumbnailer, ffmpeg, xdg-utils, udisks2, gvfs, gvfs-fuse, gvfs-smb, gvfs-nfs, avahi-tools, samba-client, cifs-utils, nfs-utils]
      apk:
        recommends: [wl-clipboard, libarchive-tools, ripgrep]

# AUR "tidefiles-bin", built from the release tarballs. AUR registration is
# closed for now, so the PKGBUILD is only generated (dist/aur/); to publish,
# set skip_upload: false and add the AUR_KEY secret (see RELEASING.md).
aurs:
  - name: tidefiles-bin
    homepage: https://github.com/linuxbren/tidefiles
    description: Keyboard-first terminal file manager with previews, tabs and archive browsing (binary release)
    maintainers: ["linuxbren <linuxbren@gmail.com>"]
    license: MIT
    provides: [tidefiles]
    conflicts: [tidefiles]
    depends: [wl-clipboard]
    optdepends:
      - "ripgrep: faster search inside files"
      - "libarchive: browse and extract archives (bsdtar)"
      - "imagemagick: image previews"
      - "poppler: PDF previews"
      - "ffmpegthumbnailer: video previews"
      - "ffmpeg: playing videos and audio tags in previews"
      - "xdg-terminal-exec: terminal here / new window"
      - "udisks2: mount drives"
      - "gvfs: connect to servers (network places)"
      - "gvfs-smb: Windows, Mac and Samba shares"
      - "gvfs-nfs: NFS shares"
      - "avahi: find computers on the network"
      - "smbclient: list the shares on a server"
      - "cifs-utils: system (root) SMB mounts"
      - "nfs-utils: system (root) NFS mounts"
    git_url: "ssh://aur@aur.archlinux.org/tidefiles-bin.git"
    private_key: "{{ .Env.AUR_KEY }}"
    skip_upload: true
    package: |-
      install -Dm755 tidefiles "${pkgdir}/usr/bin/tidefiles"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/tidefiles-bin/LICENSE"
      install -Dm644 README.md "${pkgdir}/usr/share/doc/tidefiles-bin/README.md"
      install -Dm644 contrib/omarchy-super-c.lua "${pkgdir}/usr/share/tidefiles/omarchy-super-c.lua"

changelog:
  disable: true # release notes are written by hand (gh release edit)

release:
  github:
    owner: linuxbren
    name: tidefiles
  name_template: "v{{ .Version }}"
  prerelease: "false" # every release is a normal release (shows as Latest)
  mode: keep-existing # never overwrite notes already on the release
